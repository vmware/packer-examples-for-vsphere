---
name: Release
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
      - name: Extract Release Notes
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          heading="## $TAG"
          if ! grep -qxF -- "$heading" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::No '$heading' section in CHANGELOG.md."
            exit 1
          fi
          awk -v heading="$heading" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md >"$RUNNER_TEMP/notes.md"
          if grep -qF 'Release Date: Not Released' "$RUNNER_TEMP/notes.md"; then
            echo "::error file=CHANGELOG.md::Set the release date for $TAG in CHANGELOG.md."
            exit 1
          fi
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error file=CHANGELOG.md::The '$heading' section in CHANGELOG.md is empty."
            exit 1
          fi
          cat "$RUNNER_TEMP/notes.md"
      - name: Create Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
