---
version: 2
updates:
  - package-ecosystem: "github-actions"
    target-branch: develop
    directory: "/"
    schedule:
      interval: weekly
      timezone: "America/New_York"
      day: "sunday"
      time: "00:00"
    labels:
      - "area/dependencies"
      - "area/github-actions"
      - "type/chore"
    commit-message:
      prefix: "chore(deps):"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
  - package-ecosystem: "terraform"
    target-branch: develop
    directories:
      - "/terraform/vsphere-role"
      - "/terraform/vsphere-virtual-machine/*"
    schedule:
      interval: weekly
      timezone: "America/New_York"
      day: "sunday"
      time: "00:00"
    labels:
      - "area/dependencies"
      - "type/chore"
    commit-message:
      prefix: "chore(deps):"
    ignore:
      - dependency-name: "terraform"
        update-types: ["version-update:semver-patch"]
      - dependency-name: "vmware/vsphere"
        update-types: ["version-update:semver-patch"]
      - dependency-name: "hashicorp/hcp"
        update-types: ["version-update:semver-patch"]
    # Open one pull request per dependency across all the directories.
    groups:
      terraform:
        group-by: dependency-name
        patterns:
          - "terraform"
      terraform-vsphere:
        group-by: dependency-name
        patterns:
          - "vmware/vsphere"
      terraform-hcp:
        group-by: dependency-name
        patterns:
          - "hashicorp/hcp"
  - package-ecosystem: "docker"
    target-branch: develop
    directory: "/.devcontainer"
    schedule:
      interval: weekly
      timezone: "America/New_York"
      day: "sunday"
      time: "00:00"
    labels:
      - "area/dependencies"
      - "type/chore"
    commit-message:
      prefix: "chore(deps):"
  - package-ecosystem: "pip"
    target-branch: develop
    directory: "/.github/workflows"
    schedule:
      interval: weekly
      timezone: "America/New_York"
      day: "sunday"
      time: "00:00"
    labels:
      - "area/dependencies"
      - "type/chore"
    commit-message:
      prefix: "chore(deps):"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
